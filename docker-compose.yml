services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"

  semantica:
    build: ./semantica
    image: syndicate/semantica:latest
    restart: unless-stopped
    environment:
      SEMANTICA_PORT: "${SEMANTICA_PORT:-8765}"
      SEMANTICA_DATA_DIR: /data
    volumes:
      - semantica-data:/data
    ports:
      - "${SEMANTICA_PORT:-8765}:8765"

  explorer:
    image: syndicate/semantica:latest
    restart: unless-stopped
    command: >
      semantica-explorer --graph /data/context-graph.json
      --port 8000 --host 0.0.0.0 --no-browser
    volumes:
      - semantica-data:/data
    ports:
      - "${EXPLORER_PORT:-8000}:8000"
    depends_on:
      - semantica

  federation:
    build: ./federation
    restart: unless-stopped
    environment:
      FEDERATION_PORT: "${FEDERATION_PORT:-8080}"
      SEMANTICA_API: http://semantica:8765
      DATA_DIR: /data
    volumes:
      - federation-data:/data
    ports:
      - "${FEDERATION_PORT:-8080}:8080"
    depends_on:
      - semantica
      - mongodb

  memory-search:
    build: ./memory-search
    image: syndicate/memory-search:latest
    restart: unless-stopped
    environment:
      OLLAMA_API: "${OLLAMA_API:-http://host.docker.internal:11434}"
      LLM_MODEL: "${MEMORY_LLM_MODEL:-llama3.2:3b}"
      EMBED_MODEL: "${MEMORY_EMBED_MODEL:-nomic-embed-text}"
      DATA_DIR: /data
      SEMANTICA_API: http://semantica:8765
      MEMORY_ROOTS: /data/memories
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - federation-data:/data
    ports:
      - "${MEMORY_SEARCH_PORT:-7878}:7878"
    depends_on:
      - semantica

volumes:
  mongo-data:
  semantica-data:
  federation-data:
