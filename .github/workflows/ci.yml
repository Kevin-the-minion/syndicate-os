name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -e
          for f in bootstrap.sh verify.sh scripts/*.sh drivers/*.sh minions/setup-minions.sh; do
            bash -n "$f" && echo "ok: $f"
          done
      - name: Python compile
        run: |
          set -e
          python3 -m py_compile federation/app.py memory-search/app.py desktop/register-connections.py constitution/generate-constitution.py council/scripts/council-run.py cost/token-watchdog.py
          echo "compile ok"

      - name: YAML + JSON validity
        run: python3 -c "import json,yaml; [yaml.safe_load(open(f)) or print('yaml ok:',f) for f in ['docker-compose.yml','docker-compose.cluster.yml','agents/distribution.yaml']]; json.load(open('constitution/council-config.json')); print('json ok')"

      - name: Constitution is in sync
        run: |
          set -e
          python3 constitution/generate-constitution.py
          git diff --exit-code constitution/CONSTITUTION.md || { echo "CONSTITUTION.md out of date — run generate-constitution.py"; exit 1; }

      - name: No secrets in repo
        run: |
          set -e
          if grep -rEn '(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' --exclude-dir=.git .; then
            echo "secret-like string found"; exit 1
          fi
          echo "no secrets"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + start the stack
        run: |
          docker compose up -d --build mongodb semantica federation
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 3
          done
          curl -sf http://localhost:8080/health >/dev/null

      - name: Federation round-trip
        run: |
          set -e
          fail() { echo "❌ $1"; echo "   body: $2"; exit 1; }
          echo "-- /post"
          R=$(curl -sf -X POST http://localhost:8080/post -H 'Content-Type: application/json' -d '{"from":"ci","message":"smoke test"}') || fail "/post curl" "$?"
          echo "$R" | grep -q posted || fail "/post body" "$R"
          echo "-- /board"
          R=$(curl -sf http://localhost:8080/board) || fail "/board curl" "$?"
          echo "$R" | grep -q "smoke test" || fail "/board body" "${R:0:300}"
          echo "-- /tenders"
          T=$(curl -sf -X POST http://localhost:8080/tenders -H 'Content-Type: application/json' -d '{"title":"ci smoke","lane":"test"}') || fail "/tenders curl" "$?"
          echo "$T" | grep -q minted || fail "/tenders body" "$T"
          echo "-- /scoreboard"
          R=$(curl -sf http://localhost:8080/scoreboard) || fail "/scoreboard" "$?"
          echo "-- /graph"
          R=$(curl -sf http://localhost:8080/graph) || fail "/graph curl" "$?"
          echo "$R" | grep -q nodes || fail "/graph body" "${R:0:300}"
          echo "-- semantica /health"
          R=$(curl -sf http://localhost:8765/health) || fail "semantica /health curl" "$?"
          echo "$R" | grep -q ok || fail "semantica /health body" "${R:0:300}"
          echo "smoke ok"

      - name: Shut down
        if: always()
        run: docker compose down -v
